<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Clients Fees</title>
    <link rel="stylesheet" href="./css/ClientMonthlyFees.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Monthly Clients Fees</h1>
            <div class="date-selection">
                <label for="dateFilter">Date selection</label>
                <input type="month" id="dateFilter" class="date-input">
            </div>
        </div>

        <div class="table-container">
            <table class="fees-table">
                <thead>
                    <tr>
                        <th>Sr No</th>
                        <th>Client Name</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="feesTableBody">
                    <!-- Data will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Payment Details</h2>
                <span class="close">&times;</span>
            </div>
            <form id="paymentForm" novalidate>
                <div class="form-group">
                    <label for="clientName">Client Name</label>
                    <input type="text" id="clientName" name="clientName" readonly>
                </div>

                <div class="form-group">
                    <label for="paymentDate">Date <span class="required">*</span></label>
                    <input type="date" id="paymentDate" name="paymentDate" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount <span class="required">*</span></label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="paymentMode">Payment Mode <span class="required">*</span></label>
                    <select id="paymentMode" name="paymentMode" required>
                        <option value="">Select Payment Mode</option>
                        <option value="cash" selected>Cash</option>
                        <option value="upi">UPI</option>
                        <option value="bank">Bank Transfer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bankSelection">Bank Account</label>
                    <select id="bankSelection" name="bankSelection">
                        <option value="">Select Bank Account</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="paymentReferenceNo">Reference Number</label>
                    <input type="text" id="paymentReferenceNo" name="paymentReferenceNo" placeholder="Enter reference number">
                </div>

                <div class="form-group">
                    <label for="paymentNotes">Notes</label>
                    <textarea id="paymentNotes" name="paymentNotes" rows="3" placeholder="Enter payment notes"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-pay">Pay</button>
                    <button type="button" class="btn btn-cancel" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Payment Details</h2>
                <span class="close">&times;</span>
            </div>
            <form id="editForm" novalidate>
                <input type="hidden" id="editPaymentId">

                <div class="form-group">
                    <label for="editClientName">Client Name</label>
                    <input type="text" id="editClientName" name="editClientName" readonly>
                </div>

                <div class="form-group">
                    <label for="editAmount">Amount <span class="required">*</span></label>
                    <input type="number" id="editAmount" name="editAmount" step="0.01" min="0" required>
                </div>

                <div class="form-group">
                    <label for="editPaymentMode">Payment Mode <span class="required">*</span></label>
                    <select id="editPaymentMode" name="editPaymentMode" required>
                        <option value="">Select Payment Mode</option>
                        <option value="cash">Cash</option>
                        <option value="upi">UPI</option>
                        <option value="bank">Bank Transfer</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editBankSelection">Bank Account</label>
                    <select id="editBankSelection" name="editBankSelection">
                        <option value="">Select Bank Account</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="editReferenceNo">Reference Number</label>
                    <input type="text" id="editReferenceNo" name="editReferenceNo" placeholder="Enter reference number">
                </div>

                <div class="form-group">
                    <label for="editNotes">Notes</label>
                    <textarea id="editNotes" name="editNotes" rows="3" placeholder="Enter payment notes"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Save</button>
                    <button type="button" class="btn btn-cancel" id="editCancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="./js/clientMonthlyReports.js"></script>
</body>

</html>
